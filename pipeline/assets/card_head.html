<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ccc;font-family:'Noto Sans CJK KR','Noto Sans CJK JP',sans-serif;padding:40px;display:flex;flex-wrap:wrap;gap:40px;width:3600px}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;background:#F4F2EC;color:#141615}
.mono{font-family:'DejaVu Sans Mono',monospace}
.wm{position:absolute;left:56px;top:56px;font-size:30px;font-weight:900;letter-spacing:10px;z-index:3}
.wm i{font-style:normal;font-weight:300;letter-spacing:4px;margin-left:10px;font-size:.55em;vertical-align:middle}
.kit{position:absolute;right:56px;top:62px;font-size:20px;letter-spacing:3px;z-index:3}
.kick{position:absolute;left:56px;font-size:22px;letter-spacing:3px;color:#8a5521;font-weight:700}
.head{position:absolute;left:56px;font-weight:800;letter-spacing:-1.5px;line-height:1.22}
.body{position:absolute;font-size:36px;line-height:1.6;font-weight:500;letter-spacing:-.8px}
.body b{font-weight:900}
.foot{position:absolute;left:56px;right:56px;bottom:46px;display:flex;justify-content:space-between;font-size:19px;letter-spacing:2px;color:#666;border-top:2px solid #141615;padding-top:16px}
.dark{background:#141615;color:#F4F2EC}
.dark .foot{border-color:#F4F2EC;color:#9a9f9c}
.dark .kick{color:#d9a441}
/* 사진: 원본 비율 그대로, 위에 아무것도 얹지 않음 */
.photo{position:absolute;display:block}
.cred{position:absolute;font-size:15px;letter-spacing:2px;color:#8b8f8c}
.ring{position:absolute;border:4px solid #141615;border-radius:50%;overflow:hidden;background:#F4F2EC}
.tick{position:absolute;height:3px;background:#141615}
.dark .tick{background:#F4F2EC}
.call{position:absolute;font-size:20px;letter-spacing:2px;line-height:1.5}
.spec{position:absolute;left:660px;right:56px}
.spec div{border-top:2px solid #3a3d3b;padding:18px 0 20px}
.spec small{display:block;font-size:17px;letter-spacing:3px;color:#9a9f9c}
.spec b{display:block;font-family:'Noto Sans CJK KR',sans-serif;font-size:50px;font-weight:900;letter-spacing:-1px;line-height:1.15;margin-top:4px}
.spec b span{font-size:24px;font-weight:500;margin-left:6px;letter-spacing:0}
</style></head><body>
