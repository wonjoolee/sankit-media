name: SANKIT NEWS build

# 뉴스는 07:28 게시 워크플로 안에서 만들지 않는다.
# 새벽에 미리 만들어 두고, 실패하면 07:28 전에 두 번 더 시도한다.
on:
  schedule:
    # GitHub 예약은 자주 늦거나 빠진다(11/28에는 세 번 다 안 왔다).
    # 그래서 04:30~06:40 사이에 여러 번 건다. 이미 만들어졌으면 즉시 빠져나온다.
    - cron: "30 19 * * *"   # 04:30 KST
    - cron: "5 20 * * *"    # 05:05 KST — 매일 제작 작업(05:23)보다 먼저 슬롯1을 잡는다
    - cron: "25 20 * * *"   # 05:25 KST
    - cron: "50 20 * * *"   # 05:50 KST
    - cron: "15 21 * * *"   # 06:15 KST
    - cron: "40 21 * * *"   # 06:40 KST
  workflow_dispatch:
    inputs:
      selftest:
        description: "1이면 /tmp 에만 만들고 커밋하지 않는다(점검용)"
        default: "0"
      date:
        description: "YYYY-MM-DD (비우면 오늘 KST)"
        default: ""

permissions:
  contents: write   # 다른 워크플로와 같다. 없으면 커밋 push가 403으로 막힌다(11/27 05:3x 실패)

concurrency:
  group: sankit-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # ubuntu-latest(26.04)는 playwright 1.56이 지원하지 않는다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: 오늘 뉴스가 이미 있는지 본다
        id: g
        run: |
          D="${{ github.event.inputs.date }}"; [ -n "$D" ] || D=$(TZ=Asia/Seoul date +%F)
          echo "d=$D" >> $GITHUB_OUTPUT
          if [ "${{ github.event.inputs.selftest }}" = "1" ]; then
            echo "out=/tmp/newstest" >> $GITHUB_OUTPUT; echo "go=1" >> $GITHUB_OUTPUT
            echo "점검 모드"; exit 0
          fi
          echo "out=queue/$D/slot1" >> $GITHUB_OUTPUT
          if [ -f "queue/$D/slot1/post.json" ]; then
            echo "go=0" >> $GITHUB_OUTPUT; echo "$D 뉴스 이미 있음 - 건너뜀"
          else
            echo "go=1" >> $GITHUB_OUTPUT
          fi

      - name: 뉴스 제작
        if: steps.g.outputs.go == '1'
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: bash pipeline/news_ci.sh "${{ steps.g.outputs.out }}" "${{ steps.g.outputs.d }}"

      - name: 커밋
        if: steps.g.outputs.go == '1' && github.event.inputs.selftest != '1'
        run: |
          git config user.name "SANKIT bot"
          git config user.email "sankit-bot@users.noreply.github.com"
          git add data queue
          git diff --cached --quiet && exit 0
          git commit -m "news ${{ steps.g.outputs.d }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*7)); done
          exit 1
