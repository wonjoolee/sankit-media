name: SANKIT threads check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Who am I on Threads
        env:
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
        run: |
          if [ -z "$TH_TOKEN" ]; then echo "TH_TOKEN 시크릿이 없습니다"; exit 1; fi
          python pipeline/threads.py whoami
