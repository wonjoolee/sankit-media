name: SANKIT publish

on:
  schedule:
    - cron: "*/15 22-23,0-14 * * *"   # 07:00~23:59 KST, 15분마다 밀린 게시 확인
  workflow_dispatch:
    inputs:
      slot:
        description: "slot 1~5 (비우면 예약 시간 기준)"
        required: false
      dry_run:
        description: "1이면 게시하지 않고 확인만"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: sankit-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish queued post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SLOT: ${{ github.event.inputs.slot }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python pipeline/run_slot.py
      - name: Update reaction stats
        if: always()
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python pipeline/stats.py
      - name: Save posted record
        run: |
          git config user.name "SANKIT bot"
          git config user.email "sankit-bot@users.noreply.github.com"
          git add queue pipeline/stats.csv || true
          git diff --cached --quiet || (git commit -m "posted $(TZ=Asia/Seoul date +%F-%H%M)" && git push)
