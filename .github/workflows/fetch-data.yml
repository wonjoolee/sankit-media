name: SANKIT fetch public data

on:
  workflow_dispatch:
  schedule:
    - cron: "40 19 * * *"   # 04:40 KST — 뉴스 제작(05:05)과 제작 세션(05:23)보다 먼저
    - cron: "0 10 * * *"    # 19:00 KST — 유럽·미국 낮 시간대 기사를 한 번 더 긁는다

permissions:
  contents: write

concurrency:
  group: sankit-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        timeout-minutes: 8
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: python pipeline/fetch_data.py
      - name: 해외 업계 소식 RSS 수집
        continue-on-error: true
        timeout-minutes: 12
        run: python pipeline/fetch_news.py --days 14
      - name: 국내 소식 수집 (네이버 뉴스 검색)
        continue-on-error: true
        timeout-minutes: 6
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python pipeline/fetch_news_kr.py

      - name: 그날 수집 요약
        continue-on-error: true
        run: python pipeline/news_digest.py
      - name: Commit
        run: |
          git config user.name "SANKIT bot"
          git config user.email "sankit-bot@users.noreply.github.com"
          git add data research/news_feed.csv research/digest_*.md
          git diff --cached --quiet || (git commit -m "data $(TZ=Asia/Seoul date +%F-%H%M)" && (git push || (git pull --rebase && git push)))
