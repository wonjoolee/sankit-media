name: SANKIT fetch public data

on:
  workflow_dispatch:
  schedule:
    - cron: "40 19 * * *"   # 04:40 KST 백업 (실제로는 새벽 제작 세션이 직접 실행)

permissions:
  contents: write

concurrency:
  group: sankit-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python pipeline/fetch_data.py
      - name: Commit
        run: |
          git config user.name "SANKIT bot"
          git config user.email "sankit-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data $(TZ=Asia/Seoul date +%F-%H%M)" && (git push || (git pull --rebase && git push)))
